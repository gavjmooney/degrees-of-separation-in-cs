[project]
name = "dblp-pipeline"
version = "0.1.0"
description = "Offline preprocessing pipeline: DBLP XML -> co-authorship graph artifacts"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dblp_pipeline"]
